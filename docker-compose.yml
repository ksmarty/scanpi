services:
  scanpi:
    build: .
    container_name: scanpi
    ports:
      - "5123:5123"
    volumes:
      - ./scans:/scans
      - /var/lock:/var/lock
    environment:
      - DEBUG=False
      - ROOT_PATH=/
      - SCAN_DIRECTORY=/scans
      - SOURCES=ADF Front,ADF Back,ADF Duplex
      - MODES=Lineart,Halftone,Gray,Color
      - RESOLUTIONS=50,100,150,200,250,300,350,400,450,500,550,600
      - DATE_FORMAT=%Y-%m-%d-%H-%M-%S
      - PROCESSING_LOCKFILE=/var/lock/.scanlock
    # Platform-specific scanner access:
    
    # macOS (Docker Desktop): USB passthrough not supported natively
    # Option 1: Use network scanner (IP/eSCL)
    # Option 2: Run SANE server on host, connect via network
    # Option 3: Use --network=host and access via host.docker.internal
    network_mode: host
    
    # Linux: Uncomment below for direct USB access
    # devices:
    #   - /dev/bus/usb:/dev/bus/usb
    # privileged: true
    
    # Windows (Docker Desktop): Uncomment below
    # devices:
    #   - /dev/bus/usb:/dev/bus/usb
    # privileged: true
    
    restart: unless-stopped