<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ScanPi - Document Scanner</title>
    <!-- <link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='favicon.svg') }}"> -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.6.1/cropper.min.css" rel="stylesheet">
    <style>
        :root {
            --primary-color: #2c3e50;
            --secondary-color: #3498db;
            --accent-color: #27ae60;
            --bg-gradient: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }
        
        html, body {
            height: 100%;
            overflow: hidden;
        }

        body {
            background: var(--bg-gradient);
            font-family: 'Segoe UI', system-ui, sans-serif;
            display: flex;
            flex-direction: column;
        }

        .app-wrapper {
            flex: 1;
            padding: 0.75rem;
            display: flex;
            flex-direction: column;
            min-height: 0;
        }
        
        .card {
            border: none;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            background: rgba(255, 255, 255, 0.95);
            flex: 1;
            display: flex;
            flex-direction: column;
            min-height: 0;
            overflow: hidden;
        }
        
        .card-body {
            flex: 1;
            display: flex;
            flex-direction: column;
            min-height: 0;
            overflow: hidden;
        }
        
            background: var(--primary-color);
            color: white;
            border-radius: 16px 16px 0 0 !important;
            padding: 1.25rem;
        }
        
        .form-label {
            font-weight: 600;
            color: var(--primary-color);
            margin-bottom: 0.5rem;
        }
        
        .form-control, .form-select {
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            padding: 0.75rem 1rem;
            transition: all 0.3s ease;
        }
        
        .form-control:focus, .form-select:focus {
            border-color: var(--secondary-color);
            box-shadow: 0 0 0 3px rgba(52, 152, 219, 0.15);
        }
        
        .form-control[readonly] {
            background-color: #f8f9fa;
            cursor: not-allowed;
        }
        
        .btn-scan {
            background: linear-gradient(135deg, var(--accent-color) 0%, #219a52 100%);
            border: none;
            padding: 0.75rem 1.5rem;
            font-size: 1rem;
            font-weight: 600;
            border-radius: 8px;
            transition: all 0.3s ease;
        }
        
        .btn-scan:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(39, 174, 96, 0.4);
        }
        
        .btn-preview {
            background: linear-gradient(135deg, var(--secondary-color) 0%, #2980b9 100%);
            border: none;
            padding: 0.75rem 1.5rem;
            font-size: 1rem;
        }
        
        .btn-preview:hover {
            box-shadow: 0 10px 30px rgba(52, 152, 219, 0.4);
        }
        
        .btn:disabled {
            opacity: 0.7;
            cursor: not-allowed;
        }
        
        .scanner-icon {
            font-size: 1.5rem;
            margin-right: 0.5rem;
        }
        
        .preview-container {
            background: #1a1a1a;
            border-radius: 8px;
            flex: 1;
            min-height: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
        }
        
        .preview-placeholder {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #6c757d;
            text-align: center;
            pointer-events: none;
            width: 100%;
        }
        
        .preview-placeholder i {
            font-size: 4rem;
            opacity: 0.3;
        }

        .scan-overlay {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0, 0, 0, 0.7);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 10;
            color: white;
            display: none;
        }
        
        .edit-controls {
            background: #f8f9fa;
            border-radius: 8px;
            padding: 1rem;
            margin-top: 0.75rem;
        }
        
        .edit-btn {
            padding: 0.5rem 0.75rem;
            font-size: 0.9rem;
        }
        
        .edit-btn.active {
            background: var(--secondary-color);
            color: white;
        }
        
        .slider-container {
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }
        
        .slider-container input[type="range"] {
            flex: 1;
        }
        
        .slider-container label {
            min-width: 80px;
            font-size: 0.85rem;
        }
        
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
        
        .scanning {
            animation: pulse 1.5s infinite;
        }
        
        .spinner-icon {
            width: 20px;
            height: 20px;
            border: 2px solid #fff;
            border-top-color: transparent;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            display: inline-block;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        
        .split-pane {
            display: grid;
            grid-template-columns: 350px 1fr;
            gap: 1.5rem;
            align-items: stretch;
            flex: 1;
            min-height: 0;
        }
        
        .controls-panel {
            overflow-y: auto;
        }

        .preview-panel {
            display: flex;
            flex-direction: column;
            min-height: 0;
        }
        
        @media (max-width: 992px) {
            .split-pane {
                grid-template-columns: 1fr;
                overflow-y: auto;
            }
            .preview-panel {
                min-height: 400px;
            }
        }
        
        .crop-overlay {
            position: absolute;
            border: 2px dashed var(--accent-color);
            background: rgba(39, 174, 96, 0.1);
            cursor: move;
            display: none;
        }
        
        .crop-handle {
            position: absolute;
            width: 12px;
            height: 12px;
            background: var(--accent-color);
            border-radius: 2px;
        }
    </style>
</head>
<body>
    <div class="app-wrapper">
        <div class="card">
            <div class="card-header d-flex align-items-center justify-content-between">
                <div class="d-flex align-items-center">
                    <i class="bi bi-scanner scanner-icon"></i>
                    <div>
                        <h5 class="mb-0">ScanPi</h5>
                        <small class="opacity-75">Document Scanner</small>
                    </div>
                </div>
                <span class="badge bg-light text-dark">v2.2</span>
            </div>
            <div class="card-body p-3">
                {% if message %}
                <div class="alert alert-{{ 'success' if 'successfully' in message else 'danger' }} d-flex align-items-center mb-4" role="alert">
                    <i class="bi bi-{{ 'check-circle-fill' if 'successfully' in message else 'exclamation-triangle-fill' }} me-2"></i>
                    {{ message }}
                </div>
                {% endif %}
                
                <div class="split-pane">
                    <div class="controls-panel">
                        <div class="mb-3">
                            <label for="scanner" class="form-label">
                                <i class="bi bi-hdd me-1"></i>Select Scanner
                            </label>
                            <select class="form-select" id="scanner" name="scanner">
                                <option value="">Auto-detect scanner</option>
                            </select>
                        </div>
                        
                        <div class="mb-3">
                            <label for="name" class="form-label">
                                <i class="bi bi-file-text me-1"></i>Document Name
                            </label>
                            <input type="text" class="form-control" id="name" name="name" 
                                   placeholder="Enter document name" required>
                        </div>
                        
                        <div class="mb-3">
                            <label for="date" class="form-label">
                                <i class="bi bi-calendar me-1"></i>Date
                            </label>
                            <input type="text" class="form-control" id="date" name="date" 
                                   value="{{ default_date }}" readonly>
                        </div>
                        
                        <div class="mb-3">
                            <label for="mode" class="form-label">
                                <i class="bi bi-palette me-1"></i>Scan Mode
                            </label>
                            <select class="form-select" id="mode" name="mode">
                                {% for mode in modes %}
                                <option value="{{ mode }}">{{ mode }}</option>
                                {% endfor %}
                            </select>
                        </div>
                        
                        <div class="mb-3">
                            <label for="resolution" class="form-label">
                                <i class="bi bi-aspect-ratio me-1"></i>Resolution (DPI)
                            </label>
                            <select class="form-select" id="resolution" name="resolution">
                                {% for res in resolutions %}
                                <option value="{{ res }}" {{ 'selected' if res == '600' else '' }}>{{ res }} DPI</option>
                                {% endfor %}
                            </select>
                        </div>
                        
                        <div class="mb-4">
                            <label for="source" class="form-label">
                                <i class="bi bi-upc me-1"></i>Scanner Source
                            </label>
                            <select class="form-select" id="source" name="source">
                                {% for src in sources %}
                                <option value="{{ src }}">{{ src }}</option>
                                {% endfor %}
                            </select>
                        </div>
                        
                        <div class="d-flex gap-2">
                            <button type="button" class="btn btn-preview text-white flex-fill" id="previewBtn">
                                <i class="bi bi-eye me-2"></i>Preview
                            </button>
                            <button type="button" class="btn btn-scan text-white flex-fill" id="submitBtn">
                                <i class="bi bi-scan me-2"></i>Scan
                            </button>
                        </div>
                    </div>
                    
                    <div class="preview-panel">
                        <label class="form-label">
                            <i class="bi bi-image me-1"></i>Preview
                        </label>
                        <div class="preview-container" id="previewContainer">
                            <img id="previewImage" style="display: none; max-width: 100%;">
                            <div class="preview-placeholder" id="previewPlaceholder">
                                <i class="bi bi-card-image d-block mb-2"></i>
                                <div>Click "Preview" to scan a test image</div>
                            </div>
                            <div class="scan-overlay" id="scanOverlay">
                                <div class="spinner-border text-light mb-2" style="width: 3rem; height: 3rem;" role="status"></div>
                                <div id="scanOverlayText">Scanning...</div>
                            </div>
                        </div>
                        
                        <div class="edit-controls" id="editControls" style="display: none;">
                            <div class="d-flex flex-wrap gap-2 mb-3">
                                <button type="button" class="btn btn-outline-secondary edit-btn" id="panBtn" title="Pan Image">
                                    <i class="bi bi-arrows-move"></i> Pan
                                </button>
                                <button type="button" class="btn btn-outline-secondary edit-btn" id="cropBoxBtn" title="Draw Crop Box">
                                    <i class="bi bi-crop"></i> Crop Box
                                </button>
                                <button type="button" class="btn btn-outline-secondary edit-btn" id="rotateLeftBtn" title="Rotate Left">
                                    <i class="bi bi-arrow-counterclockwise"></i> Rotate Left
                                </button>
                                <button type="button" class="btn btn-outline-secondary edit-btn" id="rotateRightBtn" title="Rotate Right">
                                    <i class="bi bi-arrow-clockwise"></i> Rotate Right
                                </button>
                                <button type="button" class="btn btn-outline-secondary edit-btn" id="flipHBtn" title="Flip Horizontal">
                                    <i class="bi bi-arrow-left-right"></i> Flip H
                                </button>
                                <button type="button" class="btn btn-outline-secondary edit-btn" id="flipVBtn" title="Flip Vertical">
                                    <i class="bi bi-arrow-up-down"></i> Flip V
                                </button>
                                <button type="button" class="btn btn-outline-secondary edit-btn" id="resetBtn" title="Reset View">
                                    <i class="bi bi-arrow-counterclockwise"></i> Reset
                                </button>
                            </div>
                            
                            <div class="row g-2 mb-2">
                                <div class="col-sm-6">
                                    <div class="slider-container">
                                        <label style="min-width: 90px;">Zoom Speed</label>
                                        <input type="range" class="form-range" id="zoomSpeed" min="0.05" max="0.5" step="0.05" value="0.1">
                                        <span id="zoomSpeedVal" style="min-width: 30px; text-align: right;">0.1</span>
                                    </div>
                                </div>
                                <div class="col-sm-6">
                                    <div class="slider-container">
                                        <label style="min-width: 90px;">Sharpen</label>
                                        <input type="range" class="form-range" id="sharpen" min="0" max="100" value="0">
                                        <span id="sharpenVal" style="min-width: 30px; text-align: right;">0</span>
                                    </div>
                                </div>
                            </div>
                            <div class="row g-2">
                                <div class="col-sm-6">
                                    <div class="slider-container">
                                        <label style="min-width: 90px;">Brightness</label>
                                        <input type="range" class="form-range" id="brightness" min="-100" max="100" value="0">
                                        <span id="brightnessVal" style="min-width: 30px; text-align: right;">0</span>
                                    </div>
                                </div>
                                <div class="col-sm-6">
                                    <div class="slider-container">
                                        <label style="min-width: 90px;">Contrast</label>
                                        <input type="range" class="form-range" id="contrast" min="-100" max="100" value="0">
                                        <span id="contrastVal" style="min-width: 30px; text-align: right;">0</span>
                                    </div>
                                </div>
                            </div>
                        </div>
                        
                        <div class="mt-2 text-muted small text-center" id="previewStatus"></div>
                    </div>
                </div>
                
                <form method="POST" id="scanForm" style="display: none;">
                    <input type="hidden" name="name" id="formName">
                    <input type="hidden" name="date" id="formDate">
                    <input type="hidden" name="mode" id="formMode">
                    <input type="hidden" name="resolution" id="formResolution">
                    <input type="hidden" name="source" id="formSource">
                    <input type="hidden" name="scanner" id="formScanner">
                    <input type="hidden" name="edited_image" id="editedImage">
                </form>
            </div>
        </div>
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.6.1/cropper.min.js"></script>
    <script>
        const scannerSelect = document.getElementById('scanner');
        const previewBtn = document.getElementById('previewBtn');
        const submitBtn = document.getElementById('submitBtn');
        const previewImage = document.getElementById('previewImage');
        const previewPlaceholder = document.getElementById('previewPlaceholder');
        const previewStatus = document.getElementById('previewStatus');
        const editControls = document.getElementById('editControls');
        const scanOverlay = document.getElementById('scanOverlay');
        const scanOverlayText = document.getElementById('scanOverlayText');
        
        const modeSelect = document.getElementById('mode');
        const resolutionSelect = document.getElementById('resolution');
        const sourceSelect = document.getElementById('source');
        
        let originalImageObj = null;
        let cropper = null;
        let currentFlipH = 1;
        let currentFlipV = 1;
        let brightness = 0;
        let contrast = 0;
        let sharpen = 0;
        
        async function loadDevices() {
            try {
                const res = await fetch('/api/devices');
                const scanners = await res.json();
                
                scannerSelect.innerHTML = '<option value="">Auto-detect scanner</option>';
                scanners.forEach(s => {
                    const option = document.createElement('option');
                    option.value = s.id;
                    option.textContent = s.description ? `${s.id} - ${s.description}` : s.id;
                    if ('{{ selected_scanner }}' === s.id) option.selected = true;
                    scannerSelect.appendChild(option);
                });
                
                if (scanners.length === 1) {
                    loadCapabilities(scanners[0].id);
                }
            } catch (e) {
                console.error('Failed to load devices:', e);
            }
        }
        
        async function loadCapabilities(scanner) {
            try {
                const res = await fetch(`/api/capabilities?scanner=${encodeURIComponent(scanner)}`);
                const caps = await res.json();
                
                if (caps.sources && caps.sources.length) {
                    sourceSelect.innerHTML = caps.sources.map(s => `<option value="${s}">${s}</option>`).join('');
                }
                if (caps.modes && caps.modes.length) {
                    modeSelect.innerHTML = caps.modes.map(m => `<option value="${m}">${m}</option>`).join('');
                }
                if (caps.resolutions && caps.resolutions.length) {
                    resolutionSelect.innerHTML = caps.resolutions.map(r =>
                        `<option value="${r}" ${r === '600' ? 'selected' : ''}>${r} DPI</option>`
                    ).join('');
                    // Fall back to closest to 600 if 600 isn't in the list
                    if (!caps.resolutions.includes('600')) {
                        const closest = caps.resolutions.reduce((a, b) =>
                            Math.abs(parseInt(b) - 600) < Math.abs(parseInt(a) - 600) ? b : a
                        );
                        resolutionSelect.value = closest;
                    }
                }
            } catch (e) {
                console.error('Failed to load capabilities:', e);
            }
        }
        
        async function runPreview() {
            const scanner = scannerSelect.value;
            const mode = modeSelect.value;
            const resolution = resolutionSelect.value;
            
            previewBtn.disabled = true;
            scanOverlay.style.display = 'flex';
            scanOverlayText.textContent = 'Generating preview...';
            previewStatus.textContent = 'Scanning...';
            
            try {
                const res = await fetch('/api/preview', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ scanner, mode, resolution })
                });
                
                if (!res.ok) {
                    const err = await res.json();
                    throw new Error(err.error || 'Preview failed');
                }
                
                const blob = await res.blob();
                const img = new Image();
                img.onload = function() {
                    originalImageObj = img;
                    resetEdits();
                    
                    previewImage.src = img.src;
                    previewImage.style.display = 'block';
                    previewPlaceholder.style.display = 'none';
                    editControls.style.display = 'block';
                    
                    if (cropper) cropper.destroy();
                    cropper = new Cropper(previewImage, {
                        viewMode: 1,
                        dragMode: 'pan',
                        autoCrop: false,
                        toggleDragModeOnDblclick: false,
                        wheelZoomRatio: parseFloat(document.getElementById('zoomSpeed').value) || 0.1
                    });
                    
                    previewStatus.textContent = 'Preview ready — Select "Crop Box" to isolate an area';
                };
                img.src = URL.createObjectURL(blob);
            } catch (e) {
                previewImage.style.display = 'none';
                if (cropper) cropper.destroy();
                cropper = null;
                previewPlaceholder.style.display = 'block';
                previewPlaceholder.innerHTML = `<i class="bi bi-exclamation-triangle text-danger d-block mb-2"></i><div class="text-danger">${e.message}</div>`;
                previewStatus.textContent = '';
                editControls.style.display = 'none';
            } finally {
                previewBtn.disabled = false;
                scanOverlay.style.display = 'none';
            }
        }
        
        function resetEdits() {
            currentFlipH = 1;
            currentFlipV = 1;
            brightness = 0;
            contrast = 0;
            sharpen = 0;
            document.getElementById('brightness').value = 0;
            document.getElementById('contrast').value = 0;
            document.getElementById('sharpen').value = 0;
            document.getElementById('brightnessVal').textContent = '0';
            document.getElementById('contrastVal').textContent = '0';
            document.getElementById('sharpenVal').textContent = '0';
        }
        
        function applyFilters() {
            if (!originalImageObj || !cropper) return;
            
            const canvas = document.createElement('canvas');
            canvas.width = originalImageObj.width;
            canvas.height = originalImageObj.height;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(originalImageObj, 0, 0);
            
            let imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
            
            if (brightness !== 0 || contrast !== 0) {
                imgData = applyBrightnessContrast(imgData, brightness, contrast);
            }
            
            if (sharpen > 0) {
                imgData = applySharpen(imgData, sharpen / 100);
            }
            
            ctx.putImageData(imgData, 0, 0);
            // Replace the cropper source image without resetting zoom/cropbox (true flag)
            cropper.replace(canvas.toDataURL('image/png'), true);
        }
        
        function applyBrightnessContrast(imageData, brightness, contrast) {
            const data = imageData.data;
            const factor = (259 * (contrast + 255)) / (255 * (259 - contrast));
            
            for (let i = 0; i < data.length; i += 4) {
                data[i] = factor * (data[i] - 128) + 128 + brightness;
                data[i + 1] = factor * (data[i + 1] - 128) + 128 + brightness;
                data[i + 2] = factor * (data[i + 2] - 128) + 128 + brightness;
            }
            
            return imageData;
        }
        
        function applySharpen(imageData, amount) {
            const data = imageData.data;
            const width = imageData.width;
            const height = imageData.height;
            const kernel = [
                0, -amount, 0,
                -amount, 1 + 4 * amount, -amount,
                0, -amount, 0
            ];
            
            const copy = new Uint8ClampedArray(data);
            
            for (let y = 1; y < height - 1; y++) {
                for (let x = 1; x < width - 1; x++) {
                    for (let c = 0; c < 3; c++) {
                        let val = 0;
                        for (let ky = -1; ky <= 1; ky++) {
                            for (let kx = -1; kx <= 1; kx++) {
                                const idx = ((y + ky) * width + (x + kx)) * 4 + c;
                                val += copy[idx] * kernel[(ky + 1) * 3 + (kx + 1)];
                            }
                        }
                        data[(y * width + x) * 4 + c] = Math.max(0, Math.min(255, val));
                    }
                }
            }
            
            return imageData;
        }
        
        document.getElementById('rotateLeftBtn').addEventListener('click', () => cropper && cropper.rotate(-90));
        document.getElementById('rotateRightBtn').addEventListener('click', () => cropper && cropper.rotate(90));
        
        document.getElementById('flipHBtn').addEventListener('click', function() {
            if (!cropper) return;
            currentFlipH *= -1;
            cropper.scaleX(currentFlipH);
        });
        
        document.getElementById('flipVBtn').addEventListener('click', function() {
            if (!cropper) return;
            currentFlipV *= -1;
            cropper.scaleY(currentFlipV);
        });
        
        document.getElementById('panBtn').addEventListener('click', () => cropper && cropper.setDragMode('pan'));
        document.getElementById('cropBoxBtn').addEventListener('click', () => cropper && cropper.setDragMode('crop'));
        
        document.getElementById('resetBtn').addEventListener('click', function() {
            if (originalImageObj && cropper) {
                resetEdits();
                cropper.reset();
                cropper.scale(1, 1);
                applyFilters();
            }
        });
        
        document.getElementById('zoomSpeed').addEventListener('input', function() {
            document.getElementById('zoomSpeedVal').textContent = this.value;
            if (cropper) {
                cropper.options.wheelZoomRatio = parseFloat(this.value);
            }
        });
        
        document.getElementById('brightness').addEventListener('input', function() {
            document.getElementById('brightnessVal').textContent = this.value;
        });
        document.getElementById('brightness').addEventListener('change', function() {
            brightness = parseInt(this.value);
            applyFilters();
        });
        
        document.getElementById('contrast').addEventListener('input', function() {
            document.getElementById('contrastVal').textContent = this.value;
        });
        document.getElementById('contrast').addEventListener('change', function() {
            contrast = parseInt(this.value);
            applyFilters();
        });
        
        document.getElementById('sharpen').addEventListener('input', function() {
            document.getElementById('sharpenVal').textContent = this.value;
        });
        document.getElementById('sharpen').addEventListener('change', function() {
            sharpen = parseInt(this.value);
            applyFilters();
        });
        
        function submitScan() {
            document.getElementById('formName').value = document.getElementById('name').value;
            document.getElementById('formDate').value = document.getElementById('date').value;
            document.getElementById('formMode').value = modeSelect.value;
            document.getElementById('formResolution').value = resolutionSelect.value;
            document.getElementById('formSource').value = sourceSelect.value;
            document.getElementById('formScanner').value = scannerSelect.value;
            
            if (cropper) {
                // If a crop box exists, getCroppedCanvas() yields that area.
                // If no box, it yields the whole canvas (with rotation/flip applied).
                const finalCanvas = cropper.getCroppedCanvas();
                if (finalCanvas) {
                    document.getElementById('editedImage').value = finalCanvas.toDataURL('image/png');
                }
            }
            
            submitBtn.disabled = true;
            scanOverlay.style.display = 'flex';
            scanOverlayText.textContent = 'Scanning Document...';
            
            document.getElementById('scanForm').submit();
        }
        
        previewBtn.addEventListener('click', runPreview);
        submitBtn.addEventListener('click', submitScan);
        
        scannerSelect.addEventListener('change', function() {
            if (this.value) {
                loadCapabilities(this.value);
            }
        });
        
        document.getElementById('name').addEventListener('input', function(e) {
            this.value = this.value.replace(/[^a-zA-Z0-9-_]/g, '');
        });
        
        // ── Zoom / Pan ────────────────────────────────────────────────────────
        const previewContainer = document.getElementById('previewContainer');
        const zoomIndicator    = document.getElementById('zoomIndicator');
        let vpScale = 1, vpX = 0, vpY = 0;
        let panning = false, panStart = { x: 0, y: 0 };

        function applyViewport() {
            previewCanvas.style.transform =
                `translate(${vpX}px, ${vpY}px) scale(${vpScale})`;
            zoomIndicator.textContent = `${Math.round(vpScale * 100)}%`;
        }

        function resetViewport() {
            vpScale = 1; vpX = 0; vpY = 0;
            applyViewport();
        }

        // Wheel → zoom towards cursor
        previewContainer.addEventListener('wheel', function(e) {
            if (!originalImage) return;
            e.preventDefault();
            const rect   = previewContainer.getBoundingClientRect();
            const mouseX = e.clientX - rect.left - rect.width  / 2;
            const mouseY = e.clientY - rect.top  - rect.height / 2;
            const factor = e.deltaY < 0 ? 1.15 : 1 / 1.15;
            const next   = Math.min(Math.max(vpScale * factor, 0.25), 20);
            const ratio  = next / vpScale;
            vpX = mouseX + (vpX - mouseX) * ratio;
            vpY = mouseY + (vpY - mouseY) * ratio;
            vpScale = next;
            applyViewport();
        }, { passive: false });

        // Drag → pan
        previewContainer.addEventListener('mousedown', function(e) {
            if (!originalImage || e.button !== 0) return;
            panning = true;
            panStart = { x: e.clientX - vpX, y: e.clientY - vpY };
            previewContainer.classList.add('has-image'); // ensure grab cursor
        });
        window.addEventListener('mousemove', function(e) {
            if (!panning) return;
            vpX = e.clientX - panStart.x;
            vpY = e.clientY - panStart.y;
            applyViewport();
        });
        window.addEventListener('mouseup', function() { panning = false; });

        // Double-click → reset zoom/pan
        previewContainer.addEventListener('dblclick', function() {
            if (!originalImage) return;
            resetViewport();
        });

        // Show/hide zoom indicator with image state
        function setPreviewHasImage(yes) {
            previewContainer.classList.toggle('has-image', yes);
            zoomIndicator.style.display = yes ? 'block' : 'none';
        }
        // ─────────────────────────────────────────────────────────────────────

        loadDevices();
    </script>
</body>
</html>
