<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ScanPi - Document Scanner</title>
    <!-- daisyUI + Tailwind -->
    <link href="https://cdn.jsdelivr.net/npm/daisyui@4.11.1/dist/full.min.css" rel="stylesheet" type="text/css" />
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Icons & Cropper -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.6.1/cropper.min.css" rel="stylesheet">
</head>
<body class="h-screen w-screen overflow-hidden bg-gradient-to-br from-indigo-500 to-purple-600 p-4 flex flex-col font-sans">
    
    <div class="card bg-base-100 shadow-2xl flex-1 overflow-hidden flex flex-col">
        <!-- Header -->
        <div class="bg-neutral text-neutral-content p-4 flex items-center justify-between shadow-sm z-10 rounded-t-2xl">
            <div class="flex items-center gap-3">
                <i class="bi bi-scanner text-3xl"></i>
                <div>
                    <h5 class="font-bold text-xl leading-none">ScanPi</h5>
                    <div class="text-xs opacity-75">Document Scanner</div>
                </div>
            </div>
            <span class="badge badge-outline">v2.3</span>
        </div>

        <!-- Body -->
        <div class="card-body p-4 flex flex-col min-h-0">
            {% if message %}
            <div role="alert" class="alert {{ 'alert-success' if 'successfully' in message else 'alert-error' }} shadow-sm mb-4">
                <i class="bi bi-{{ 'check-circle-fill' if 'successfully' in message else 'exclamation-triangle-fill' }} text-xl"></i>
                <span>{{ message }}</span>
            </div>
            {% endif %}
            
            <div class="flex-1 grid grid-cols-1 lg:grid-cols-[350px_1fr] gap-6 min-h-0">
                
                <!-- Controls Panel -->
                <div class="flex flex-col gap-3 overflow-y-auto pr-2">
                    <div class="form-control w-full">
                        <label class="label pt-0 pb-1" for="scanner">
                            <span class="label-text font-bold text-primary"><i class="bi bi-hdd mr-1"></i>Select Scanner</span>
                        </label>
                        <select class="select select-bordered select-sm w-full text-base h-10" id="scanner" name="scanner">
                            <option value="">Auto-detect scanner</option>
                        </select>
                    </div>
                    
                    <div class="form-control w-full">
                        <label class="label pt-0 pb-1" for="name">
                            <span class="label-text font-bold text-primary"><i class="bi bi-file-text mr-1"></i>Document Name</span>
                        </label>
                        <input type="text" class="input input-bordered input-sm w-full text-base h-10" id="name" name="name" placeholder="Enter document name" required>
                    </div>
                    
                    <div class="form-control w-full">
                        <label class="label pt-0 pb-1" for="date">
                            <span class="label-text font-bold text-primary"><i class="bi bi-calendar mr-1"></i>Date</span>
                        </label>
                        <input type="text" class="input input-bordered input-sm w-full text-base h-10 bg-base-200 cursor-not-allowed" id="date" name="date" value="{{ default_date }}" readonly>
                    </div>
                    
                    <div class="form-control w-full">
                        <label class="label pt-0 pb-1" for="mode">
                            <span class="label-text font-bold text-primary"><i class="bi bi-palette mr-1"></i>Scan Mode</span>
                        </label>
                        <select class="select select-bordered select-sm w-full text-base h-10" id="mode" name="mode">
                            {% for mode in modes %}
                            <option value="{{ mode }}">{{ mode }}</option>
                            {% endfor %}
                        </select>
                    </div>
                    
                    <div class="form-control w-full">
                        <label class="label pt-0 pb-1" for="resolution">
                            <span class="label-text font-bold text-primary"><i class="bi bi-aspect-ratio mr-1"></i>Resolution (DPI)</span>
                        </label>
                        <select class="select select-bordered select-sm w-full text-base h-10" id="resolution" name="resolution">
                            {% for res in resolutions %}
                            <option value="{{ res }}" {{ 'selected' if res == '600' else '' }}>{{ res }} DPI</option>
                            {% endfor %}
                        </select>
                    </div>
                    
                    <div class="form-control w-full mb-2">
                        <label class="label pt-0 pb-1" for="source">
                            <span class="label-text font-bold text-primary"><i class="bi bi-upc mr-1"></i>Scanner Source</span>
                        </label>
                        <select class="select select-bordered select-sm w-full text-base h-10" id="source" name="source">
                            {% for src in sources %}
                            <option value="{{ src }}">{{ src }}</option>
                            {% endfor %}
                        </select>
                    </div>
                    
                    <div class="flex gap-2 mt-auto pt-2">
                        <button type="button" class="btn btn-secondary flex-1" id="previewBtn">
                            <i class="bi bi-eye"></i>Preview
                        </button>
                        <button type="button" class="btn btn-primary flex-1" id="submitBtn">
                            <i class="bi bi-scan"></i>Scan
                        </button>
                    </div>
                </div>
                
                <!-- Preview Panel -->
                <div class="flex flex-col min-h-0">
                    <label class="font-bold text-primary mb-2 flex-none">
                        <i class="bi bi-image mr-1"></i>Preview
                    </label>
                    <div class="bg-base-200 rounded-xl flex-1 min-h-0 flex items-center justify-center relative overflow-hidden shadow-inner border border-base-300" id="previewContainer">
                        <img id="previewImage" class="hidden max-w-full">
                        <div id="previewPlaceholder" class="absolute inset-0 flex flex-col items-center justify-center text-base-content/30 pointer-events-none">
                            <i class="bi bi-card-image text-6xl mb-3"></i>
                            <div class="font-medium">Click "Preview" to scan a test image</div>
                        </div>
                        <div id="scanOverlay" class="absolute inset-0 bg-neutral/80 flex flex-col items-center justify-center text-white z-10 hidden backdrop-blur-sm transition-all">
                            <span class="loading loading-spinner loading-lg text-primary mb-4"></span>
                            <div id="scanOverlayText" class="text-lg font-medium tracking-wide">Scanning...</div>
                        </div>
                    </div>
                    
                    <div class="bg-base-200 rounded-xl p-4 mt-3 shadow-inner border border-base-300 hidden flex-none" id="editControls">
                        <div class="flex flex-wrap gap-2 mb-4">
                            <button type="button" class="btn btn-sm btn-outline" id="panBtn" title="Pan Image">
                                <i class="bi bi-arrows-move"></i> Pan
                            </button>
                            <button type="button" class="btn btn-sm btn-outline" id="cropBoxBtn" title="Draw Crop Box">
                                <i class="bi bi-crop"></i> Crop Box
                            </button>
                            <div class="join">
                                <button type="button" class="btn btn-sm btn-outline join-item" id="rotateLeftBtn" title="Rotate Left">
                                    <i class="bi bi-arrow-counterclockwise"></i>
                                </button>
                                <button type="button" class="btn btn-sm btn-outline join-item" id="rotateRightBtn" title="Rotate Right">
                                    <i class="bi bi-arrow-clockwise"></i>
                                </button>
                            </div>
                            <div class="join">
                                <button type="button" class="btn btn-sm btn-outline join-item" id="flipHBtn" title="Flip Horizontal">
                                    <i class="bi bi-arrow-left-right"></i> Flip H
                                </button>
                                <button type="button" class="btn btn-sm btn-outline join-item" id="flipVBtn" title="Flip Vertical">
                                    <i class="bi bi-arrow-up-down"></i> Flip V
                                </button>
                            </div>
                            <button type="button" class="btn btn-sm btn-ghost ml-auto" id="resetBtn" title="Reset View">
                                <i class="bi bi-arrow-counterclockwise"></i> Reset
                            </button>
                        </div>
                        
                        <div class="grid grid-cols-1 sm:grid-cols-2 gap-x-6 gap-y-3">
                            <div class="flex items-center gap-3">
                                <label class="w-24 text-sm font-semibold whitespace-nowrap text-base-content/80">Zoom Speed</label>
                                <input type="range" class="range range-xs range-primary flex-1" id="zoomSpeed" min="0.05" max="0.5" step="0.05" value="0.1">
                                <span id="zoomSpeedVal" class="w-8 text-right text-sm font-mono opacity-80">0.1</span>
                            </div>
                            <div class="flex items-center gap-3">
                                <label class="w-24 text-sm font-semibold whitespace-nowrap text-base-content/80">Sharpen</label>
                                <input type="range" class="range range-xs range-primary flex-1" id="sharpen" min="0" max="100" value="0">
                                <span id="sharpenVal" class="w-8 text-right text-sm font-mono opacity-80">0</span>
                            </div>
                            <div class="flex items-center gap-3">
                                <label class="w-24 text-sm font-semibold whitespace-nowrap text-base-content/80">Brightness</label>
                                <input type="range" class="range range-xs range-primary flex-1" id="brightness" min="-100" max="100" value="0">
                                <span id="brightnessVal" class="w-8 text-right text-sm font-mono opacity-80">0</span>
                            </div>
                            <div class="flex items-center gap-3">
                                <label class="w-24 text-sm font-semibold whitespace-nowrap text-base-content/80">Contrast</label>
                                <input type="range" class="range range-xs range-primary flex-1" id="contrast" min="-100" max="100" value="0">
                                <span id="contrastVal" class="w-8 text-right text-sm font-mono opacity-80">0</span>
                            </div>
                        </div>
                    </div>
                    
                    <div class="mt-2 text-center text-sm opacity-60 flex-none h-5" id="previewStatus"></div>
                </div>
            </div>
            
            <form method="POST" id="scanForm" class="hidden">
                <input type="hidden" name="name" id="formName">
                <input type="hidden" name="date" id="formDate">
                <input type="hidden" name="mode" id="formMode">
                <input type="hidden" name="resolution" id="formResolution">
                <input type="hidden" name="source" id="formSource">
                <input type="hidden" name="scanner" id="formScanner">
                <input type="hidden" name="edited_image" id="editedImage">
            </form>
        </div>
    </div>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.6.1/cropper.min.js"></script>
    <script>
        const scannerSelect = document.getElementById('scanner');
        const previewBtn = document.getElementById('previewBtn');
        const submitBtn = document.getElementById('submitBtn');
        const previewImage = document.getElementById('previewImage');
        const previewPlaceholder = document.getElementById('previewPlaceholder');
        const previewStatus = document.getElementById('previewStatus');
        const editControls = document.getElementById('editControls');
        const scanOverlay = document.getElementById('scanOverlay');
        const scanOverlayText = document.getElementById('scanOverlayText');
        
        const modeSelect = document.getElementById('mode');
        const resolutionSelect = document.getElementById('resolution');
        const sourceSelect = document.getElementById('source');
        
        let originalImageObj = null;
        let cropper = null;
        let currentFlipH = 1;
        let currentFlipV = 1;
        let brightness = 0;
        let contrast = 0;
        let sharpen = 0;
        
        async function loadDevices() {
            try {
                const res = await fetch('/api/devices');
                const scanners = await res.json();
                
                scannerSelect.innerHTML = '<option value="">Auto-detect scanner</option>';
                scanners.forEach(s => {
                    const option = document.createElement('option');
                    option.value = s.id;
                    option.textContent = s.description ? `${s.id} - ${s.description}` : s.id;
                    if ('{{ selected_scanner }}' === s.id) option.selected = true;
                    scannerSelect.appendChild(option);
                });
                
                if (scanners.length === 1) {
                    loadCapabilities(scanners[0].id);
                }
            } catch (e) {
                console.error('Failed to load devices:', e);
            }
        }
        
        async function loadCapabilities(scanner) {
            try {
                const res = await fetch(`/api/capabilities?scanner=${encodeURIComponent(scanner)}`);
                const caps = await res.json();
                
                if (caps.sources && caps.sources.length) {
                    sourceSelect.innerHTML = caps.sources.map(s => `<option value="${s}">${s}</option>`).join('');
                }
                if (caps.modes && caps.modes.length) {
                    modeSelect.innerHTML = caps.modes.map(m => `<option value="${m}">${m}</option>`).join('');
                }
                if (caps.resolutions && caps.resolutions.length) {
                    resolutionSelect.innerHTML = caps.resolutions.map(r =>
                        `<option value="${r}" ${r === '600' ? 'selected' : ''}>${r} DPI</option>`
                    ).join('');
                    if (!caps.resolutions.includes('600')) {
                        const closest = caps.resolutions.reduce((a, b) =>
                            Math.abs(parseInt(b) - 600) < Math.abs(parseInt(a) - 600) ? b : a
                        );
                        resolutionSelect.value = closest;
                    }
                }
            } catch (e) {
                console.error('Failed to load capabilities:', e);
            }
        }
        
        async function runPreview() {
            const scanner = scannerSelect.value;
            const mode = modeSelect.value;
            const resolution = resolutionSelect.value;
            
            previewBtn.disabled = true;
            scanOverlay.classList.remove('hidden');
            scanOverlayText.textContent = 'Generating preview...';
            previewStatus.textContent = 'Scanning...';
            
            try {
                const res = await fetch('/api/preview', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ scanner, mode, resolution })
                });
                
                if (!res.ok) {
                    const err = await res.json();
                    throw new Error(err.error || 'Preview failed');
                }
                
                const blob = await res.blob();
                const img = new Image();
                img.onload = function() {
                    originalImageObj = img;
                    resetEdits();
                    
                    previewImage.src = img.src;
                    previewImage.classList.remove('hidden');
                    previewPlaceholder.classList.add('hidden');
                    editControls.classList.remove('hidden');
                    
                    if (cropper) cropper.destroy();
                    cropper = new Cropper(previewImage, {
                        viewMode: 1,
                        dragMode: 'pan',
                        autoCrop: false,
                        toggleDragModeOnDblclick: false,
                        wheelZoomRatio: parseFloat(document.getElementById('zoomSpeed').value) || 0.1
                    });
                    
                    previewStatus.textContent = 'Preview ready — Select "Crop Box" to isolate an area';
                };
                img.src = URL.createObjectURL(blob);
            } catch (e) {
                previewImage.classList.add('hidden');
                if (cropper) cropper.destroy();
                cropper = null;
                previewPlaceholder.classList.remove('hidden');
                previewPlaceholder.innerHTML = `<i class="bi bi-exclamation-triangle text-error text-6xl block mb-3"></i><div class="text-error font-medium">${e.message}</div>`;
                previewStatus.textContent = '';
                editControls.classList.add('hidden');
            } finally {
                previewBtn.disabled = false;
                scanOverlay.classList.add('hidden');
            }
        }
        
        function resetEdits() {
            currentFlipH = 1;
            currentFlipV = 1;
            brightness = 0;
            contrast = 0;
            sharpen = 0;
            document.getElementById('brightness').value = 0;
            document.getElementById('contrast').value = 0;
            document.getElementById('sharpen').value = 0;
            document.getElementById('brightnessVal').textContent = '0';
            document.getElementById('contrastVal').textContent = '0';
            document.getElementById('sharpenVal').textContent = '0';
        }
        
        function applyFilters() {
            if (!originalImageObj || !cropper) return;
            
            const canvas = document.createElement('canvas');
            canvas.width = originalImageObj.width;
            canvas.height = originalImageObj.height;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(originalImageObj, 0, 0);
            
            let imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
            
            if (brightness !== 0 || contrast !== 0) {
                imgData = applyBrightnessContrast(imgData, brightness, contrast);
            }
            
            if (sharpen > 0) {
                imgData = applySharpen(imgData, sharpen / 100);
            }
            
            ctx.putImageData(imgData, 0, 0);
            cropper.replace(canvas.toDataURL('image/png'), true);
        }
        
        function applyBrightnessContrast(imageData, brightness, contrast) {
            const data = imageData.data;
            const factor = (259 * (contrast + 255)) / (255 * (259 - contrast));
            for (let i = 0; i < data.length; i += 4) {
                data[i] = factor * (data[i] - 128) + 128 + brightness;
                data[i + 1] = factor * (data[i + 1] - 128) + 128 + brightness;
                data[i + 2] = factor * (data[i + 2] - 128) + 128 + brightness;
            }
            return imageData;
        }
        
        function applySharpen(imageData, amount) {
            const data = imageData.data;
            const width = imageData.width;
            const height = imageData.height;
            const kernel = [
                0, -amount, 0,
                -amount, 1 + 4 * amount, -amount,
                0, -amount, 0
            ];
            const copy = new Uint8ClampedArray(data);
            for (let y = 1; y < height - 1; y++) {
                for (let x = 1; x < width - 1; x++) {
                    for (let c = 0; c < 3; c++) {
                        let val = 0;
                        for (let ky = -1; ky <= 1; ky++) {
                            for (let kx = -1; kx <= 1; kx++) {
                                const idx = ((y + ky) * width + (x + kx)) * 4 + c;
                                val += copy[idx] * kernel[(ky + 1) * 3 + (kx + 1)];
                            }
                        }
                        data[(y * width + x) * 4 + c] = Math.max(0, Math.min(255, val));
                    }
                }
            }
            return imageData;
        }
        
        document.getElementById('rotateLeftBtn').addEventListener('click', () => cropper && cropper.rotate(-90));
        document.getElementById('rotateRightBtn').addEventListener('click', () => cropper && cropper.rotate(90));
        
        document.getElementById('flipHBtn').addEventListener('click', function() {
            if (!cropper) return;
            currentFlipH *= -1;
            cropper.scaleX(currentFlipH);
        });
        
        document.getElementById('flipVBtn').addEventListener('click', function() {
            if (!cropper) return;
            currentFlipV *= -1;
            cropper.scaleY(currentFlipV);
        });
        
        document.getElementById('panBtn').addEventListener('click', () => cropper && cropper.setDragMode('pan'));
        document.getElementById('cropBoxBtn').addEventListener('click', () => cropper && cropper.setDragMode('crop'));
        
        document.getElementById('resetBtn').addEventListener('click', function() {
            if (originalImageObj && cropper) {
                resetEdits();
                cropper.reset();
                cropper.scale(1, 1);
                applyFilters();
            }
        });
        
        document.getElementById('zoomSpeed').addEventListener('input', function() {
            document.getElementById('zoomSpeedVal').textContent = this.value;
            if (cropper) cropper.options.wheelZoomRatio = parseFloat(this.value);
        });
        
        document.getElementById('brightness').addEventListener('input', function() {
            document.getElementById('brightnessVal').textContent = this.value;
        });
        document.getElementById('brightness').addEventListener('change', function() {
            brightness = parseInt(this.value);
            applyFilters();
        });
        
        document.getElementById('contrast').addEventListener('input', function() {
            document.getElementById('contrastVal').textContent = this.value;
        });
        document.getElementById('contrast').addEventListener('change', function() {
            contrast = parseInt(this.value);
            applyFilters();
        });
        
        document.getElementById('sharpen').addEventListener('input', function() {
            document.getElementById('sharpenVal').textContent = this.value;
        });
        document.getElementById('sharpen').addEventListener('change', function() {
            sharpen = parseInt(this.value);
            applyFilters();
        });
        
        function submitScan() {
            document.getElementById('formName').value = document.getElementById('name').value;
            document.getElementById('formDate').value = document.getElementById('date').value;
            document.getElementById('formMode').value = modeSelect.value;
            document.getElementById('formResolution').value = resolutionSelect.value;
            document.getElementById('formSource').value = sourceSelect.value;
            document.getElementById('formScanner').value = scannerSelect.value;
            
            if (cropper) {
                const finalCanvas = cropper.getCroppedCanvas();
                if (finalCanvas) {
                    document.getElementById('editedImage').value = finalCanvas.toDataURL('image/png');
                }
            }
            
            submitBtn.disabled = true;
            scanOverlay.classList.remove('hidden');
            scanOverlayText.textContent = 'Scanning Document...';
            
            document.getElementById('scanForm').submit();
        }
        
        previewBtn.addEventListener('click', runPreview);
        submitBtn.addEventListener('click', submitScan);
        
        scannerSelect.addEventListener('change', function() {
            if (this.value) loadCapabilities(this.value);
        });
        
        document.getElementById('name').addEventListener('input', function(e) {
            this.value = this.value.replace(/[^a-zA-Z0-9-_]/g, '');
        });
        
        loadDevices();
    </script>
</body>
</html>
