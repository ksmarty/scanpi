<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ScanPi - Document Scanner</title>
    <!-- daisyUI + Tailwind -->
    <link href="https://cdn.jsdelivr.net/npm/daisyui@4.11.1/dist/full.min.css" rel="stylesheet" type="text/css" />
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Icons & Cropper -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.6.1/cropper.min.css" rel="stylesheet">
</head>
<body class="h-screen w-screen overflow-hidden bg-gradient-to-br from-indigo-500 to-purple-600 p-4 flex flex-col font-sans">
    
    <div class="card bg-base-100 shadow-2xl flex-1 overflow-hidden flex flex-col">
        <!-- Header -->
        <div class="bg-neutral text-neutral-content p-4 flex items-center justify-between shadow-sm z-10 rounded-t-2xl">
            <div class="flex items-center gap-3">
                <i class="bi bi-scanner text-3xl"></i>
                <div>
                    <h5 class="font-bold text-xl leading-none">ScanPi</h5>
                    <div class="text-xs opacity-75">Document Scanner</div>
                </div>
            </div>
            <div class="flex items-center gap-4">
                <label class="swap swap-rotate text-xl" title="Toggle Dark/Light Mode">
                    <input type="checkbox" id="themeToggle" />
                    <i class="bi bi-sun swap-on"></i>
                    <i class="bi bi-moon-stars swap-off"></i>
                </label>
                <span class="badge badge-outline">v2.3</span>
            </div>
        </div>

        <!-- Body -->
        <div class="card-body p-4 flex flex-col min-h-0">
            {% if message %}
            <div role="alert" class="alert {{ 'alert-success' if 'successfully' in message else 'alert-error' }} shadow-sm mb-4">
                <i class="bi bi-{{ 'check-circle-fill' if 'successfully' in message else 'exclamation-triangle-fill' }} text-xl"></i>
                <span>{{ message }}</span>
            </div>
            {% endif %}
            
            <div class="flex-1 grid grid-cols-1 lg:grid-cols-[350px_1fr] gap-6 min-h-0">
                
                <!-- Controls Panel -->
                <div class="flex flex-col gap-3 overflow-y-auto pr-2">
                    <div class="form-control w-full">
                        <label class="label pt-0 pb-1" for="scanner">
                            <span class="label-text font-bold text-primary"><i class="bi bi-hdd mr-1"></i>Select Scanner</span>
                        </label>
                        <div class="flex gap-2">
                            <select class="select select-bordered select-sm flex-1 text-base h-10 min-w-0 text-ellipsis overflow-hidden whitespace-nowrap" id="scanner" name="scanner">
                                <option value="">Auto-detect scanner</option>
                            </select>
                            <button type="button" class="btn btn-sm btn-outline h-10 w-10 p-0" id="refreshScannerBtn" title="Refresh Scanners">
                                <i class="bi bi-arrow-repeat text-lg"></i>
                            </button>
                        </div>
                    </div>
                    
                    <div class="form-control w-full">
                        <label class="label pt-0 pb-1" for="name">
                            <span class="label-text font-bold text-primary"><i class="bi bi-file-text mr-1"></i>Document Name</span>
                        </label>
                        <input type="text" class="input input-bordered input-sm w-full text-base h-10" id="name" name="name" placeholder="Enter document name" required>
                    </div>
                    
                    <div class="form-control w-full">
                        <label class="label pt-0 pb-1" for="date">
                            <span class="label-text font-bold text-primary"><i class="bi bi-calendar mr-1"></i>Date</span>
                        </label>
                        <input type="text" class="input input-bordered input-sm w-full text-base h-10 bg-base-200 cursor-not-allowed" id="date" name="date" value="{{ default_date }}" readonly>
                    </div>
                    
                    <div class="form-control w-full">
                        <label class="label pt-0 pb-1" for="mode">
                            <span class="label-text font-bold text-primary"><i class="bi bi-palette mr-1"></i>Scan Mode</span>
                        </label>
                        <select class="select select-bordered select-sm w-full text-base h-10" id="mode" name="mode">
                            {% for mode in modes %}
                            <option value="{{ mode }}">{{ mode }}</option>
                            {% endfor %}
                        </select>
                    </div>
                    
                    <div class="form-control w-full">
                        <label class="label pt-0 pb-1" for="resolution">
                            <span class="label-text font-bold text-primary"><i class="bi bi-aspect-ratio mr-1"></i>Resolution (DPI)</span>
                        </label>
                        <select class="select select-bordered select-sm w-full text-base h-10" id="resolution" name="resolution">
                            {% for res in resolutions %}
                            <option value="{{ res }}" {{ 'selected' if res == '600' else '' }}>{{ res }} DPI</option>
                            {% endfor %}
                        </select>
                    </div>
                    
                    <div class="form-control w-full mb-2">
                        <label class="label pt-0 pb-1" for="source">
                            <span class="label-text font-bold text-primary"><i class="bi bi-upc mr-1"></i>Scanner Source</span>
                        </label>
                        <select class="select select-bordered select-sm w-full text-base h-10" id="source" name="source">
                            {% for src in sources %}
                            <option value="{{ src }}">{{ src }}</option>
                            {% endfor %}
                        </select>
                    </div>

                    <details class="collapse collapse-arrow border border-base-300 bg-base-200 mt-2 mb-2 rounded-lg">
                        <summary class="collapse-title text-sm font-semibold text-base-content/80 min-h-0 py-2 px-4">
                            <i class="bi bi-gear mr-2"></i>Advanced Settings
                        </summary>
                        <div class="collapse-content px-4 pb-3">
                            <div class="flex items-center gap-3 w-full mt-2">
                                <label class="text-sm font-semibold whitespace-nowrap text-base-content/80 flex-none">Zoom Speed</label>
                                <input type="range" class="range range-xs range-primary flex-1 min-w-0" id="zoomSpeed" min="0.05" max="0.5" step="0.05" value="0.1">
                                <input type="number" class="input input-bordered input-xs w-16 text-right font-mono flex-none" id="zoomSpeedInput" min="0.05" max="0.5" step="0.05" value="0.1">
                            </div>
                        </div>
                    </details>
                    
                    <div class="flex gap-2 mt-auto pt-2">
                        <button type="button" class="btn btn-secondary flex-1" id="previewBtn">
                            <i class="bi bi-eye"></i>Preview
                        </button>
                        <button type="button" class="btn btn-primary flex-1" id="submitBtn">
                            <i class="bi bi-scan"></i>Scan
                        </button>
                    </div>
                </div>
                
                <!-- Preview Panel -->
                <div class="flex flex-col min-h-0">
                    <label class="font-bold text-primary mb-2 flex-none">
                        <i class="bi bi-image mr-1"></i>Preview
                    </label>
                    <div class="bg-base-200 rounded-xl flex-1 min-h-0 flex items-center justify-center relative overflow-hidden shadow-inner border border-base-300" id="previewContainer">
                        <img id="previewImage" class="hidden max-w-full">
                        <div id="previewPlaceholder" class="absolute inset-0 flex flex-col items-center justify-center text-base-content/30 pointer-events-none">
                            <i class="bi bi-card-image text-6xl mb-3"></i>
                            <div class="font-medium">Click "Preview" to scan a test image</div>
                        </div>
                        <div id="scanOverlay" class="absolute inset-0 bg-neutral/80 flex flex-col items-center justify-center text-white z-10 hidden backdrop-blur-sm transition-all">
                            <span class="loading loading-spinner loading-lg text-primary mb-4"></span>
                            <div id="scanOverlayText" class="text-lg font-medium tracking-wide">Scanning...</div>
                        </div>
                    </div>
                    
                    <div class="bg-base-200 rounded-xl p-4 mt-3 shadow-inner border border-base-300 hidden flex-none" id="editControls">
                        <div class="flex flex-wrap gap-2 mb-4">
                            <button type="button" class="btn btn-sm btn-outline" id="cropBoxBtn" title="Toggle Crop Box">
                                <i class="bi bi-crop"></i> Crop Box
                            </button>
                            <div class="join">
                                <button type="button" class="btn btn-sm btn-outline join-item" id="rotateLeftBtn" title="Rotate Left">
                                    <i class="bi bi-arrow-counterclockwise"></i>
                                </button>
                                <button type="button" class="btn btn-sm btn-outline join-item" id="rotateRightBtn" title="Rotate Right">
                                    <i class="bi bi-arrow-clockwise"></i>
                                </button>
                            </div>
                            <div class="join">
                                <button type="button" class="btn btn-sm btn-outline join-item" id="flipHBtn" title="Flip Horizontal">
                                    <i class="bi bi-arrow-left-right"></i> Flip H
                                </button>
                                <button type="button" class="btn btn-sm btn-outline join-item" id="flipVBtn" title="Flip Vertical">
                                    <i class="bi bi-arrow-up-down"></i> Flip V
                                </button>
                            </div>
                            <div class="join ml-auto">
                                <button type="button" class="btn btn-sm btn-ghost join-item" id="undoBtn" title="Undo" disabled>
                                    <i class="bi bi-arrow-90deg-left"></i>
                                </button>
                                <button type="button" class="btn btn-sm btn-ghost join-item" id="redoBtn" title="Redo" disabled>
                                    <i class="bi bi-arrow-90deg-right"></i>
                                </button>
                                <button type="button" class="btn btn-sm btn-ghost join-item border-l border-base-300" id="resetBtn" title="Reset View">
                                    <i class="bi bi-arrow-counterclockwise"></i> Reset
                                </button>
                            </div>
                        </div>
                        
                        <div class="grid grid-cols-1 lg:grid-cols-3 gap-x-4 gap-y-3">
                            <div class="flex items-center gap-2">
                                <label class="w-20 text-sm font-semibold whitespace-nowrap text-base-content/80">Brightness</label>
                                <input type="range" class="range range-xs range-primary flex-1" id="brightness" min="-100" max="100" value="0">
                                <input type="number" class="input input-bordered input-xs w-16 text-right font-mono" id="brightnessInput" min="-100" max="100" value="0">
                            </div>
                            <div class="flex items-center gap-2">
                                <label class="w-20 text-sm font-semibold whitespace-nowrap text-base-content/80">Contrast</label>
                                <input type="range" class="range range-xs range-primary flex-1" id="contrast" min="-100" max="100" value="0">
                                <input type="number" class="input input-bordered input-xs w-16 text-right font-mono" id="contrastInput" min="-100" max="100" value="0">
                            </div>
                            <div class="flex items-center gap-2">
                                <label class="w-20 text-sm font-semibold whitespace-nowrap text-base-content/80">Sharpen</label>
                                <input type="range" class="range range-xs range-primary flex-1" id="sharpen" min="0" max="100" value="0">
                                <input type="number" class="input input-bordered input-xs w-16 text-right font-mono" id="sharpenInput" min="0" max="100" value="0">
                            </div>
                        </div>
                    </div>
                    
                    <div class="mt-2 text-center text-sm opacity-60 flex-none h-5" id="previewStatus"></div>
                </div>
            </div>
            
            <form method="POST" id="scanForm" class="hidden">
                <input type="hidden" name="name" id="formName">
                <input type="hidden" name="date" id="formDate">
                <input type="hidden" name="mode" id="formMode">
                <input type="hidden" name="resolution" id="formResolution">
                <input type="hidden" name="source" id="formSource">
                <input type="hidden" name="scanner" id="formScanner">
                <input type="hidden" name="edited_image" id="editedImage">
            </form>
        </div>
    </div>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.6.1/cropper.min.js"></script>
    <script>
        // Theme init
        const themeToggle = document.getElementById('themeToggle');
        const htmlTheme = document.documentElement;
        const savedTheme = localStorage.getItem('scanpi_theme') || 'dark';
        htmlTheme.setAttribute('data-theme', savedTheme);
        themeToggle.checked = savedTheme === 'light';
        themeToggle.addEventListener('change', (e) => {
            const t = e.target.checked ? 'light' : 'dark';
            htmlTheme.setAttribute('data-theme', t);
            localStorage.setItem('scanpi_theme', t);
        });

        const scannerSelect = document.getElementById('scanner');
        const previewBtn = document.getElementById('previewBtn');
        const submitBtn = document.getElementById('submitBtn');
        const previewImage = document.getElementById('previewImage');
        const previewPlaceholder = document.getElementById('previewPlaceholder');
        const previewStatus = document.getElementById('previewStatus');
        const editControls = document.getElementById('editControls');
        const scanOverlay = document.getElementById('scanOverlay');
        const scanOverlayText = document.getElementById('scanOverlayText');
        
        const modeSelect = document.getElementById('mode');
        const resolutionSelect = document.getElementById('resolution');
        const sourceSelect = document.getElementById('source');
        
        let originalImageObj = null;
        let originalPixels = null;
        const outputCanvas = document.createElement('canvas');
        const outputCtx = outputCanvas.getContext('2d');

        let cropper = null;
        let currentFlipH = 1;
        let currentFlipV = 1;
        let brightness = 0;
        let contrast = 0;
        let sharpen = 0;
        
        // History State
        let history = [];
        let historyIndex = -1;

        function saveState() {
            if (!cropper) return;
            
            const cropBox = cropper.getCropBoxData();
            const hasCrop = Object.keys(cropBox).length > 0;
            
            const state = {
                b: brightness, c: contrast, s: sharpen,
                flipH: currentFlipH, flipV: currentFlipV,
                cropBox: hasCrop ? cropBox : null,
                canvasData: cropper.getCanvasData(),
                rotate: cropper.getData().rotate,
                isCropMode: document.getElementById('cropBoxBtn').classList.contains('btn-active')
            };
            history = history.slice(0, historyIndex + 1);
            history.push(state);
            historyIndex++;
            updateUndoRedoBtns();
        }

        function updateUndoRedoBtns() {
            document.getElementById('undoBtn').disabled = historyIndex <= 0;
            document.getElementById('redoBtn').disabled = historyIndex >= history.length - 1;
        }

        function loadState(index) {
            if (index < 0 || index >= history.length) return;
            historyIndex = index;
            const state = history[index];
            
            brightness = state.b; contrast = state.c; sharpen = state.s;
            currentFlipH = state.flipH; currentFlipV = state.flipV;
            
            document.getElementById('brightness').value = brightness;
            document.getElementById('brightnessInput').value = brightness;
            document.getElementById('contrast').value = contrast;
            document.getElementById('contrastInput').value = contrast;
            document.getElementById('sharpen').value = sharpen;
            document.getElementById('sharpenInput').value = sharpen;
            
            applyFiltersSync();
            
            cropper.scale(currentFlipH, currentFlipV);
            cropper.rotateTo(state.rotate);
            cropper.setCanvasData(state.canvasData);
            
            if (state.cropBox) {
                cropper.crop();
                cropper.setCropBoxData(state.cropBox);
            } else {
                cropper.clear();
            }
            
            const cropBtn = document.getElementById('cropBoxBtn');
            if (state.isCropMode) {
                cropBtn.classList.add('btn-active');
                cropper.setDragMode('crop');
            } else {
                cropBtn.classList.remove('btn-active');
                cropper.setDragMode('move');
            }
            
            updateUndoRedoBtns();
        }
        
        document.getElementById('undoBtn').addEventListener('click', () => loadState(historyIndex - 1));
        document.getElementById('redoBtn').addEventListener('click', () => loadState(historyIndex + 1));
        
        async function loadDevices() {
            try {
                const res = await fetch('/api/devices');
                const scanners = await res.json();
                
                scannerSelect.innerHTML = '<option value="">Auto-detect scanner</option>';
                scanners.forEach(s => {
                    const option = document.createElement('option');
                    option.value = s.id;
                    option.textContent = s.description ? `${s.id} - ${s.description}` : s.id;
                    if ('{{ selected_scanner }}' === s.id) option.selected = true;
                    scannerSelect.appendChild(option);
                });
                
                if (scanners.length === 1) {
                    loadCapabilities(scanners[0].id);
                }
            } catch (e) {
                console.error('Failed to load devices:', e);
            }
        }
        
        async function loadCapabilities(scanner) {
            try {
                const res = await fetch(`/api/capabilities?scanner=${encodeURIComponent(scanner)}`);
                const caps = await res.json();
                
                if (caps.sources && caps.sources.length) {
                    sourceSelect.innerHTML = caps.sources.map(s => `<option value="${s}">${s}</option>`).join('');
                }
                if (caps.modes && caps.modes.length) {
                    modeSelect.innerHTML = caps.modes.map(m => `<option value="${m}">${m}</option>`).join('');
                }
                if (caps.resolutions && caps.resolutions.length) {
                    resolutionSelect.innerHTML = caps.resolutions.map(r =>
                        `<option value="${r}" ${r === '600' ? 'selected' : ''}>${r} DPI</option>`
                    ).join('');
                    if (!caps.resolutions.includes('600')) {
                        const closest = caps.resolutions.reduce((a, b) =>
                            Math.abs(parseInt(b) - 600) < Math.abs(parseInt(a) - 600) ? b : a
                        );
                        resolutionSelect.value = closest;
                    }
                }
            } catch (e) {
                console.error('Failed to load capabilities:', e);
            }
        }
        
        function initPreviewImage(img, preventHistory = false) {
            originalImageObj = img;
            
            const tempCanvas = document.createElement('canvas');
            tempCanvas.width = img.width;
            tempCanvas.height = img.height;
            tempCanvas.getContext('2d').drawImage(img, 0, 0);
            originalPixels = tempCanvas.getContext('2d').getImageData(0, 0, img.width, img.height);
            
            if (!preventHistory) {
                resetEdits();
                history = [];
                historyIndex = -1;
                document.getElementById('cropBoxBtn').classList.remove('btn-active');
            }
            
            previewImage.src = img.src;
            previewImage.classList.remove('hidden');
            previewPlaceholder.classList.add('hidden');
            editControls.classList.remove('hidden');
            
            if (cropper) cropper.destroy();
            
            let anchorData = null;
            let currentAction = null;
            
            cropper = new Cropper(previewImage, {
                viewMode: 1,
                dragMode: document.getElementById('cropBoxBtn').classList.contains('btn-active') ? 'crop' : 'move',
                autoCrop: false,
                toggleDragModeOnDblclick: false,
                wheelZoomRatio: parseFloat(document.getElementById('zoomSpeed').value) || 0.1,
                zoomOnWheel: false, // We'll handle this manually for 2-finger pan support
                cropstart: (e) => {
                    currentAction = e.detail.action;
                    if (currentAction === 'move') {
                        anchorData = cropper.getData();
                    }
                },
                cropmove: (e) => {
                    if (currentAction === 'move' && anchorData) {
                        cropper.setData(anchorData);
                    }
                },
                cropend: (e) => {
                    currentAction = null;
                    anchorData = null;
                    saveState();
                },
                zoom: (e) => {
                    const data = cropper.getData();
                    setTimeout(() => {
                        if (cropper) cropper.setData(data);
                    }, 0);
                }
            });
            
            previewStatus.textContent = 'Preview ready — Toggle "Crop Box" to isolate an area';
            
            if (!preventHistory) {
                setTimeout(saveState, 100);
            }

            // Handle trackpad 2-finger pan vs zoom
            previewContainer.addEventListener('wheel', function(e) {
                if (!cropper) return;
                e.preventDefault();
                
                // ctrlKey is true for pinch-to-zoom on Mac trackpads
                if (e.ctrlKey || e.metaKey) {
                    const ratio = parseFloat(document.getElementById('zoomSpeed').value) || 0.1;
                    cropper.zoom(e.deltaY < 0 ? ratio : -ratio, e);
                } else {
                    // Standard 2-finger scroll = pan
                    cropper.move(-e.deltaX, -e.deltaY);
                }
            }, { passive: false });
        }

        async function runPreview() {
            const scanner = scannerSelect.value;
            const mode = modeSelect.value;
            const resolution = resolutionSelect.value;
            
            previewBtn.disabled = true;
            scanOverlay.classList.remove('hidden');
            scanOverlayText.textContent = 'Generating preview...';
            previewStatus.textContent = 'Scanning...';
            
            try {
                const res = await fetch('/api/preview', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ scanner, mode, resolution })
                });
                
                if (!res.ok) {
                    const err = await res.json();
                    throw new Error(err.error || 'Preview failed');
                }
                
                const blob = await res.blob();
                
                // Persist preview blob base64 to localstorage
                const reader = new FileReader();
                reader.onloadend = () => {
                    try {
                        localStorage.setItem('scanpi_preview_img', reader.result);
                    } catch (e) {
                        console.warn('Preview too large for localStorage', e);
                    }
                };
                reader.readAsDataURL(blob);

                const img = new Image();
                img.onload = () => initPreviewImage(img);
                img.src = URL.createObjectURL(blob);
            } catch (e) {
                previewImage.classList.add('hidden');
                if (cropper) cropper.destroy();
                cropper = null;
                previewPlaceholder.classList.remove('hidden');
                previewPlaceholder.innerHTML = `<i class="bi bi-exclamation-triangle text-error text-6xl block mb-3"></i><div class="text-error font-medium">${e.message}</div>`;
                previewStatus.textContent = '';
                editControls.classList.add('hidden');
            } finally {
                previewBtn.disabled = false;
                scanOverlay.classList.add('hidden');
            }
        }
        
        function resetEdits() {
            currentFlipH = 1;
            currentFlipV = 1;
            brightness = 0;
            contrast = 0;
            sharpen = 0;
            document.getElementById('brightness').value = 0;
            document.getElementById('brightnessInput').value = 0;
            document.getElementById('contrast').value = 0;
            document.getElementById('contrastInput').value = 0;
            document.getElementById('sharpen').value = 0;
            document.getElementById('sharpenInput').value = 0;
        }
        
        function applyFiltersSync() {
            if (!originalImageObj || !cropper) return;
            
            outputCanvas.width = originalImageObj.width;
            outputCanvas.height = originalImageObj.height;
            
            if (brightness === 0 && contrast === 0 && sharpen === 0) {
                cropper.replace(originalImageObj.src, true);
                return;
            }
            
            const imgData = new ImageData(
                new Uint8ClampedArray(originalPixels.data),
                originalPixels.width,
                originalPixels.height
            );
            
            if (brightness !== 0 || contrast !== 0) {
                applyBrightnessContrast(imgData, brightness, contrast);
            }
            
            if (sharpen > 0) {
                applySharpen(imgData, sharpen / 100);
            }
            
            outputCtx.putImageData(imgData, 0, 0);
            cropper.replace(outputCanvas.toDataURL('image/png'), true);
        }

        let filterPending = false;
        function scheduleFilters() {
            if (!filterPending) {
                filterPending = true;
                requestAnimationFrame(() => {
                    applyFiltersSync();
                    filterPending = false;
                });
            }
        }
        
        function applyBrightnessContrast(imageData, brightness, contrast) {
            const data = imageData.data;
            const factor = (259 * (contrast + 255)) / (255 * (259 - contrast));
            for (let i = 0; i < data.length; i += 4) {
                data[i] = factor * (data[i] - 128) + 128 + brightness;
                data[i + 1] = factor * (data[i + 1] - 128) + 128 + brightness;
                data[i + 2] = factor * (data[i + 2] - 128) + 128 + brightness;
            }
            return imageData;
        }
        
        function applySharpen(imageData, amount) {
            const data = imageData.data;
            const width = imageData.width;
            const height = imageData.height;
            const kernel = [
                0, -amount, 0,
                -amount, 1 + 4 * amount, -amount,
                0, -amount, 0
            ];
            const copy = new Uint8ClampedArray(data);
            for (let y = 1; y < height - 1; y++) {
                for (let x = 1; x < width - 1; x++) {
                    for (let c = 0; c < 3; c++) {
                        let val = 0;
                        for (let ky = -1; ky <= 1; ky++) {
                            for (let kx = -1; kx <= 1; kx++) {
                                const idx = ((y + ky) * width + (x + kx)) * 4 + c;
                                val += copy[idx] * kernel[(ky + 1) * 3 + (kx + 1)];
                            }
                        }
                        data[(y * width + x) * 4 + c] = Math.max(0, Math.min(255, val));
                    }
                }
            }
            return imageData;
        }
        
        document.getElementById('refreshScannerBtn').addEventListener('click', async function() {
            const icon = this.querySelector('i');
            icon.classList.add('animate-spin');
            try {
                const res = await fetch('/api/devices?refresh=1');
                const scanners = await res.json();
                scannerSelect.innerHTML = '<option value="">Auto-detect scanner</option>';
                scanners.forEach(s => {
                    const option = document.createElement('option');
                    option.value = s.id;
                    option.textContent = s.description ? `${s.id} - ${s.description}` : s.id;
                    scannerSelect.appendChild(option);
                });
                if (scanners.length === 1) {
                    scannerSelect.value = scanners[0].id;
                    loadCapabilities(scanners[0].id);
                }
            } catch(e) {
                console.error(e);
            }
            icon.classList.remove('animate-spin');
        });

        document.getElementById('rotateLeftBtn').addEventListener('click', () => {
            if (cropper) { cropper.rotate(-90); saveState(); }
        });
        document.getElementById('rotateRightBtn').addEventListener('click', () => {
            if (cropper) { cropper.rotate(90); saveState(); }
        });
        
        document.getElementById('flipHBtn').addEventListener('click', function() {
            if (!cropper) return;
            currentFlipH *= -1;
            cropper.scaleX(currentFlipH);
            saveState();
        });
        
        document.getElementById('flipVBtn').addEventListener('click', function() {
            if (!cropper) return;
            currentFlipV *= -1;
            cropper.scaleY(currentFlipV);
            saveState();
        });
        
        document.getElementById('cropBoxBtn').addEventListener('click', function() {
            if (!cropper) return;
            const isActive = this.classList.toggle('btn-active');
            if (isActive) {
                cropper.crop();
                cropper.setDragMode('crop');
            } else {
                cropper.clear();
                cropper.setDragMode('move');
            }
            saveState();
        });
        
        document.getElementById('resetBtn').addEventListener('click', function() {
            if (originalImageObj && cropper) {
                resetEdits();
                cropper.reset();
                cropper.scale(1, 1);
                document.getElementById('cropBoxBtn').classList.remove('btn-active');
                cropper.clear();
                cropper.setDragMode('move');
                applyFiltersSync();
                history = [];
                historyIndex = -1;
                saveState();
            }
        });

        function bindSlider(sliderId, inputId, type) {
            const slider = document.getElementById(sliderId);
            const input = document.getElementById(inputId);
            
            const updateVal = (val, save) => {
                let num = type === 'z' ? parseFloat(val) : parseInt(val);
                if (isNaN(num)) num = 0;
                slider.value = num;
                input.value = num;
                
                if (type === 'z') {
                    if (cropper) cropper.options.wheelZoomRatio = num;
                } else {
                    if (type === 'b') brightness = num;
                    if (type === 'c') contrast = num;
                    if (type === 's') sharpen = num;
                    scheduleFilters();
                }
                if (save && type !== 'z') saveState();
            };
            
            slider.addEventListener('input', (e) => updateVal(e.target.value, false));
            slider.addEventListener('change', (e) => updateVal(e.target.value, true));
            input.addEventListener('input', (e) => updateVal(e.target.value, false));
            input.addEventListener('change', (e) => updateVal(e.target.value, true));
        }
        
        bindSlider('zoomSpeed', 'zoomSpeedInput', 'z');
        bindSlider('brightness', 'brightnessInput', 'b');
        bindSlider('contrast', 'contrastInput', 'c');
        bindSlider('sharpen', 'sharpenInput', 's');
        
        function submitScan() {
            document.getElementById('formName').value = document.getElementById('name').value;
            document.getElementById('formDate').value = document.getElementById('date').value;
            document.getElementById('formMode').value = modeSelect.value;
            document.getElementById('formResolution').value = resolutionSelect.value;
            document.getElementById('formSource').value = sourceSelect.value;
            document.getElementById('formScanner').value = scannerSelect.value;
            
            if (cropper) {
                const finalCanvas = cropper.getCroppedCanvas();
                if (finalCanvas) {
                    document.getElementById('editedImage').value = finalCanvas.toDataURL('image/png');
                }
            }
            
            submitBtn.disabled = true;
            scanOverlay.classList.remove('hidden');
            scanOverlayText.textContent = 'Scanning Document...';
            
            document.getElementById('scanForm').submit();
        }
        
        previewBtn.addEventListener('click', runPreview);
        submitBtn.addEventListener('click', submitScan);
        
        scannerSelect.addEventListener('change', function() {
            if (this.value) loadCapabilities(this.value);
        });
        
        document.getElementById('name').addEventListener('input', function(e) {
            this.value = this.value.replace(/[^a-zA-Z0-9-_]/g, '');
        });
        
        document.addEventListener('DOMContentLoaded', () => {
            const savedImg = localStorage.getItem('scanpi_preview_img');
            if (savedImg) {
                const img = new Image();
                img.onload = () => initPreviewImage(img, true); // true prevents overwriting initial history state prematurely
                img.src = savedImg;
            }
        });
        
        loadDevices();
    </script>
</body>
</html>
